[package]
name = "superdoh-dns"
version = "0.2.0"
edition = "2024"
publish = false
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
domain = { version = "=0.12.3", default-features = false, features = ["std", "serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
octseq = { version = "=0.6.1", features = ["std", "serde"] }
base64 = "0.22"
wasm-bindgen = "0.2"

[profile.release]
lto = true
opt-level = "s"
codegen-units = 1
panic = "abort"
strip = "debuginfo"
